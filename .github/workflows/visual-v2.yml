name: Front v2 visual evidence
on:
  pull_request:
    paths:
      - 'web2/**'
      - 'scripts/capture-v2.mjs'
      - 'scripts/verify-polish.mjs'
      - 'scripts/verify-germany-map.mjs'
      - 'scripts/verify-completion.mjs'
      - 'scripts/verify-judge-workflow.mjs'
      - 'scripts/verify-mobile-agent-surface.mjs'
      - 'scripts/verify-film-player.mjs'
      - 'docs/demo/final-v4/**'
      - 'package.json'
      - '.github/workflows/visual-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated Playwright capture tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - run: npm run web:build
      - name: Verify lazy film loading, full-200 seeking, captions and recovery
        # H.264/AAC media needs the official codec-enabled browser. Other UI
        # checks retain bundled Chromium. The runner already includes Chrome.
        # https://playwright.dev/docs/browsers#media-codecs
        run: |
          google-chrome --version
          node scripts/verify-film-player.mjs
        env:
          QA_OUTPUT: artifacts/screenshots/v2/film-player
          PLAYWRIGHT_CHANNEL: chrome
          FILM_COMPARE_BUNDLED: '1'
      - run: node scripts/capture-v2.mjs
      - name: Verify all v2 ARIA and responsive polish
        run: node scripts/verify-polish.mjs
      - name: Verify real Germany outline at 390 and 1280
        run: node scripts/verify-germany-map.mjs
      - name: Verify complete workflows and all UI states
        run: node scripts/verify-completion.mjs
      - name: Verify recommendation reversal and explicit AI acceptance
        run: node scripts/verify-judge-workflow.mjs
        env:
          QA_OUTPUT: artifacts/screenshots/v2/judge-workflow
      - name: Verify v2 evidence, exports, guide and PWA
        run: node scripts/verify-mobile-agent-surface.mjs
        env:
          QA_OUTPUT: artifacts/screenshots/v2/mobile-agent
      - name: Verify audited navigation, saved reload and day-off fallback
        run: node scripts/verify-final-review.mjs
        env:
          QA_OUTPUT: artifacts/screenshots/v2/final-review
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-rescue-v2-screenshots
          path: artifacts/screenshots/v2/
          retention-days: 30
          if-no-files-found: warn
